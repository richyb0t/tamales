let db=null,pend=false,S={users:[],pre:[],cfg:{},loads:{},sales:[],tr:[],cart:{},me:null,tab:'res',ib:0,tf:0,tt:1,qty:1,ru:false};
const brs=()=>S.cfg.branches||[1,2,3,4,5].map(n=>'Sucursal '+n);
const fondo=()=>S.cfg.fondo==null?250:+S.cfg.fondo;
const isOpen=i=>!(S.cfg.closed||[]).includes(i);
const BI=()=>brs().map((_,i)=>i).filter(isOpen);
const price=f=>f>=100?CH[f-100][2]:+((S.cfg.prices||{})['f'+f])||0;
const load=(b,f)=>+((S.loads[b]||{})['f'+f])||0;
const used=(b,f)=>S.sales.filter(s=>s.branch==b&&s.f==f).reduce((a,s)=>a+(s.type=='devolucion'?(s.restock?-s.qty:0):(s.type=='apartado'&&s.exp&&s.exp<Date.now()?0:s.qty)),0);
const net=(b,f)=>S.sales.filter(s=>s.branch==b&&s.f==f).reduce((a,s)=>a+(s.type=='vendido'?s.qty:s.type=='devolucion'?-s.qty:0),0);
const tx=(b,f,k)=>S.tr.filter(t=>t[k]==b).reduce((a,t)=>a+(+((t.q||{})['f'+f])||0),0);
const CL=[0.25,0.5,1],r2=x=>Math.round(x*100)/100;
const chLoad=b=>+((S.loads[b]||{}).ch)||0;
const txc=(b,k)=>S.tr.filter(t=>t[k]==b).reduce((a,t)=>a+(+((t.q||{}).ch)||0),0);
const chUsed=b=>S.sales.filter(s=>s.branch==b&&s.f>=100).reduce((a,s)=>a+(s.type=='devolucion'?(s.restock?-1:0):1)*s.qty*CL[s.f-100],0);
const chLeft=b=>r2(chLoad(b)-chUsed(b)+txc(b,'to')-txc(b,'from'));
const cartLit=x=>Object.entries(S.cart).reduce((a,[f,q])=>a+(f>=100&&f!=x?q*CL[f-100]:0),0);
const loadDone=b=>S.loads[b]!==undefined;
const pendAc=b=>S.pre.filter(p=>p.branch==b&&p.date==D&&!p.ok);
const resv=(b,f)=>S.pre.filter(p=>p.branch==b&&p.date==D).reduce((a,p)=>a+(+((p.items||{})['f'+f])||0),0);
const left=(b,f)=>f>=100?Math.max(0,Math.floor((chLeft(b)+1e-9)/CL[f-100])):load(b,f)-used(b,f)+tx(b,f,'to')-tx(b,f,'from')-resv(b,f);
const LS={get(){try{return localStorage.getItem('tm_s')}catch(e){return null}},set(v){try{v?localStorage.setItem('tm_s',v):localStorage.removeItem('tm_s')}catch(e){}}};
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2200)}
const err=e=>{console.error(e);toast(e&&e.code=='permission-denied'?'No se pudo: ya cambió o no tienes permiso':'Error: '+(e&&e.message||e))};
const lock=k=>{lock.s=lock.s||{};if(lock.s[k])return false;lock.s[k]=1;setTimeout(()=>{delete lock.s[k]},4000);return true};
function ask(msg,fn){const m=$('#modal');m.innerHTML=`<div class="card"><p>${esc(msg)}</p><div class="form"><button id="mk">Sí</button><button class="alt" id="mn">Cancelar</button></div></div>`;m.style.display='flex';$('#mn').onclick=()=>m.style.display='none';$('#mk').onclick=()=>{m.style.display='none';fn()}}

document.addEventListener('focusout',()=>setTimeout(()=>{if(pend)render()},200));

function setupView(){return `<div class="card"><h2>🫔 Bienvenido</h2><p>Crea la cuenta de <b>administrador</b> para empezar.</p><div class="form"><input id="un" placeholder="Nombre"><input id="uu" placeholder="Usuario"><input id="up" placeholder="PIN (6 dígitos)" type="password" inputmode="numeric"></div><button onclick="addUser('admin')">Crear administrador</button></div>`}

/* Un solo vendedor activo por sucursal */
const brTaken=(b,ex)=>S.users.find(u=>u.role=='vend'&&u.active!==false&&u.branch==b&&u.id!=ex);
async function setBr(id,v){const t=brTaken(+v,id);if(t){toast(brs()[+v]+' ya tiene vendedor: '+t.name);render(true);return}try{await db.doc('users/'+id).update({branch:+v});toast('Sucursal actualizada')}catch(e){err(e)}}

/* ---------- VENDEDOR ---------- */

function cadd(f,n){const c=(S.cart[f]||0)+n,b=S.me.branch;if(c<0||c>(f>=100?Math.floor((chLeft(b)-cartLit(f)+1e-9)/CL[f-100]):left(b,f))){if(f>=100&&n>0)toast('No alcanza el champurrado para ese tamaño');return}if(c)S.cart[f]=c;else delete S.cart[f];render(true)}
const ctot=()=>Object.entries(S.cart).reduce((a,[f,q])=>a+q*price(+f),0);

async function order(t,p){if(order.b)return;const b=S.me.branch,e=Object.entries(S.cart).map(([f,q])=>[+f,q]);if(!e.length)return;
 if(e.some(([f,q])=>f<100&&q>left(b,f))||cartLit(-1)>chLeft(b)+1e-9)return toast('Cambió el inventario, revisa las cantidades');
 const total=ctot(),lines=e.map(([f,q])=>q+'× '+nm(f)).join(', '),ts=Date.now(),oid=S.me.id+'-'+ts;
 const cart=S.cart;order.b=1;S.cart={};S.cd=false;render(true);
 try{const bt=db.batch();e.forEach(([f,q],i)=>bt.add('sales',{day:D,branch:b,f,qty:q,type:t,price:price(f),order:oid,by:S.me.user,ts:ts+i}));await bt.commit();try{navigator.vibrate&&navigator.vibrate(40)}catch(_){}note(t=='vendido'?'Pedido cobrado':'Pedido apartado',lines,total,t=='vendido'?p:null)}catch(x){S.cart=cart;render(true);err(x)}finally{order.b=0}}
function pay(){const tot=ctot();if(!Object.keys(S.cart).length)return;const m=$('#modal');
 m.innerHTML=`<div class="card"><small>Cobro</small><div class="big" style="font-size:38px">${money(tot)}</div><div class="form"><input type="number" min="0" inputmode="decimal" id="pg" class="wide" aria-label="Con cuánto paga el cliente" placeholder="Paga con $" oninput="chg()"></div><div class="form">${[20,50,100,200,500,1000].filter(v=>v>=tot).slice(0,3).map(v=>`<button class="gh" onclick="pgSet(${v})">$${v}</button>`).join('')}<button class="gh" onclick="pgSet(${tot})">Exacto</button></div><div id="cg" class="big" style="font-size:26px"></div><div class="form"><button id="mk">Confirmar cobro</button><button class="alt" id="mn">Cancelar</button></div></div>`;
 m.style.display='flex';$('#mn').onclick=()=>m.style.display='none';
 $('#mk').onclick=()=>{const p=$('#pg').value===''?tot:+$('#pg').value;if(p<tot)return toast('El pago no alcanza');m.style.display='none';order('vendido',p)};chg()}
function pgSet(v){$('#pg').value=v;chg()}
/* Ventana de cobro para entregas de apartados: mismo cobro y cambio que una venta normal; al confirmar llama go(pagó) */
function payAsk(tot,head,line,go){const m=$('#modal');
 m.innerHTML=`<div class="card"><small>${esc(head)}</small><p>${esc(line)}</p><small>Cobro</small><div class="big" style="font-size:38px">${money(tot)}</div><div class="form"><input type="number" min="0" inputmode="decimal" id="pq" class="wide" aria-label="Con cuánto paga el cliente" placeholder="Paga con $" oninput="pqChg(${tot})"></div><div class="form">${[20,50,100,200,500,1000].filter(v=>v>=tot).slice(0,3).map(v=>`<button class="gh" onclick="pqSet(${v},${tot})">$${v}</button>`).join('')}<button class="gh" onclick="pqSet(${tot},${tot})">Exacto</button></div><div id="cq" class="big" style="font-size:26px"></div><div class="form"><button id="mk">Confirmar cobro</button><button class="alt" id="mn">Cancelar</button></div></div>`;
 m.style.display='flex';$('#mn').onclick=()=>m.style.display='none';
 $('#mk').onclick=()=>{const v=$('#pq').value,pg=v===''?tot:+v;if(pg<tot)return toast('El pago no alcanza');m.style.display='none';go(pg)}}
function pqChg(tot){const v=$('#pq').value,e=$('#cq');if(v===''){e.textContent='';return}const d=+v-tot;e.className='big '+(d<0?'bad':'ok');e.textContent=d<0?'Faltan '+money(-d):'Cambio: '+money(d)}
function pqSet(v,tot){$('#pq').value=v;pqChg(tot)}
function chg(){const tot=ctot(),v=$('#pg').value,e=$('#cg');if(v===''){e.textContent='';return}const d=+v-tot;e.className='big '+(d<0?'bad':'ok');e.textContent=d<0?'Faltan '+money(-d):'Cambio: '+money(d)}
function note(h,l,t,p){const m=$('#modal');m.innerHTML=`<div class="card"><small>${esc(h)}</small><p>${esc(l)}</p><small>Total</small><div class="big" style="font-size:38px">${money(t)}</div>${p!=null?`<small>Pagó ${money(p)}</small><br><small>Cambio</small><div class="big ok" style="font-size:38px">${money(p-t)}</div>`:''}<div class="form"><button id="mk">Listo</button></div></div>`;m.style.display='flex';$('#mk').onclick=()=>m.style.display='none'}

/* Entregar un apartado hecho desde Vender: cobra con la misma ventana de cobro y cambio. Si el apartado fue un pedido de varios renglones, se cobra y entrega el pedido completo. */
function deliver(id){const s=S.sales.find(x=>x._id==id);if(!s)return;
 const g=s.order?S.sales.filter(x=>x.order==s.order&&x.type=='apartado'&&live(x)):[s];if(!g.length)return;
 const tot=g.reduce((a,x)=>a+x.qty*x.price,0),line=g.map(x=>x.qty+'× '+nm(x.f)).join(', ');
 payAsk(tot,'Entregar y cobrar'+(s.client?' · '+s.client:''),line,async pg=>{
  if(g.some(x=>{const c=S.sales.find(y=>y._id==x._id);return !c||c.type!='apartado'}))return toast('Este apartado ya cambió');
  try{await Promise.all(g.map(x=>db.doc('sales/'+x._id).update({type:'vendido',by:S.me.user})));try{navigator.vibrate&&navigator.vibrate(40)}catch(_){}note('Apartado entregado'+(s.client?' · '+s.client:''),line,tot,pg)}catch(e){err(e)}})}
/* Bitácora de anulaciones y cancelaciones: la ve el administrador en "Ver movimientos" de cada sucursal */
const logD=o=>{const d={day:D,by:S.me.user,byName:S.me.name,ts:Date.now(),...o};Object.keys(d).forEach(k=>d[k]==null&&delete d[k]);return d};
function logEv(o){if(!S.me)return;try{Promise.resolve(db.collection('logs').add(logD(o))).catch(e=>console.warn('logs',e))}catch(e){console.warn('logs',e)}}
async function anular(id){const s=S.sales.find(x=>x._id==id);if(!s)return;if(s.type=='vendido'&&net(s.branch,s.f)-s.qty<0)return toast('Primero hay que anular la devolución de ese sabor');ask('¿Anular este movimiento? El inventario se ajusta solo.',async()=>{try{
 /* la anulación y su registro en la bitácora van juntos: las reglas no dejan borrar una venta cobrada sin bitácora */
 const bt=db.batch();bt.set('logs/del_'+id,logD({branch:s.branch,kind:'anulacion',label:'Anulado · '+({vendido:'venta',apartado:'apartado',devolucion:'devolución'}[s.type]||s.type),txt:s.qty+'× '+nm(s.f)+(s.client?' · '+s.client:''),amt:s.qty*s.price}));bt.delete('sales/'+id);await bt.commit();toast('Anulado')}catch(e){err(e)}})}
function devForm(b){
 const opts=[...F.keys(),100,101,102].map(f=>net(b,f)>0?`<option value="${f}">${nm(f)} (vendidos: ${net(b,f)})</option>`:'').join('');
 if(!opts)return '<div class="card"><h3>Devoluciones</h3><small>Aún no hay ventas de hoy para devolver.</small></div>';
 return `<div class="card"><h3>Registrar devolución</h3><div class="form"><select id="dv_f" aria-label="Sabor a devolver">${opts}</select><input type="number" min="1" id="dv_q" value="1" aria-label="Cantidad a devolver"><select id="dv_r" aria-label="Motivo"><option>Mal estado</option><option>Pedido equivocado</option><option>Cliente no satisfecho</option><option>Otro</option></select><input id="dv_t" placeholder="Detalle del motivo"></div><label><input type="checkbox" id="dv_s"> El producto regresa al inventario</label><small style="display:block">Con champurrado ya servido normalmente no se marca.</small><div class="form"><button onclick="saveDev()">Registrar devolución</button></div></div>`}
async function saveDev(){const b=S.me.branch,f=+$('#dv_f').value,q=Math.max(1,parseInt($('#dv_q').value)||1),r=$('#dv_r').value,t=$('#dv_t').value.trim();
 if(q>net(b,f))return toast('Solo hay '+net(b,f)+' vendidos de ese sabor');
 if(r=='Otro'&&!t)return toast('Escribe el motivo');
 try{await db.collection('sales').add({day:D,branch:b,f,qty:q,type:'devolucion',price:price(f),reason:r+(t?': '+t:''),restock:$('#dv_s').checked,by:S.me.user,ts:Date.now()});toast('Devolución registrada');render(true)}catch(e){err(e)}}
function trForm(from,adm){
 S.trd=S.trd||{};if(S.trf!==from){S.trd={};S.trf=from}
 const bs=brs(),o=BI().filter(i=>i!=from),to=o.includes(S.tt)?S.tt:o[0],fl=F.map((n,f)=>[n,f,left(from,f)]).filter(x=>x[2]>0),cl=chLeft(from);
 return `<div class="card"><h3>Pasar tamales a otra sucursal</h3><small>Por ejemplo si cierran un puesto y pasan los sobrantes. Escribe cuántos pasas de cada sabor, o usa los botones.</small><div class="form">${adm?`<select onchange="S.tf=+this.value;render(true)">${bs.map((n,i)=>!isOpen(i)?'':`<option value="${i}" ${i==from?'selected':''}>De: ${esc(n)}</option>`).join('')}</select>`:''}<select onchange="S.tt=+this.value;render(true)">${o.map(i=>`<option value="${i}" ${i==to?'selected':''}>A: ${esc(bs[i])}</option>`).join('')}</select></div>${fl.length||cl>0?`<div class="form"><button class="alt" onclick="trFill(${from},1)">Pasar todo</button><button class="gh" onclick="trFill(${from},0)">Poner todo en 0</button></div>`+fl.map(x=>`<div class="row"><div>${x[0]}<br><small>quedan ${x[2]}</small></div><input type="number" min="0" id="tq${x[1]}" value="${S.trd['f'+x[1]]??0}" oninput="S.trd['f${x[1]}']=this.value"></div>`).join('')+(cl>0?`<div class="row"><div>☕ Champurrado<br><small>quedan ${cl} L</small></div><input type="number" min="0" step="0.25" inputmode="decimal" id="tqch" value="${S.trd.ch??0}" oninput="S.trd.ch=this.value"></div>`:'')+`<div class="form"><button onclick="doTr(${from},${to})">Pasar</button></div>`:'<small>No quedan tamales en esta sucursal.</small>'}</div>`}
function trFill(from,all){S.trd={};if(all){F.forEach((_,f)=>{const l=left(from,f);if(l>0)S.trd['f'+f]=l});const c=chLeft(from);if(c>0)S.trd.ch=c}render(true)}
function doTr(from,to){const q={};let n=0,lc=0;F.forEach((_,f)=>{const v=$('#tq'+f);if(!v)return;const x=Math.min(Math.max(0,parseInt(v.value)||0),left(from,f));if(x>0){q['f'+f]=x;n+=x}});
 const vc=$('#tqch');if(vc){const x=r2(Math.min(Math.max(0,parseFloat(vc.value)||0),chLeft(from)));if(x>0){q.ch=x;lc=x}}
 if(!n&&!lc)return toast('No hay nada para pasar');
 ask(`¿Pasar ${[n?n+' tamales':'',lc?lc+' L de champurrado':''].filter(Boolean).join(' y ')} de ${brs()[from]} a ${brs()[to]}?`,async()=>{try{await db.collection('transfers').add({day:D,from,to,q,n,by:S.me.user,ts:Date.now()});S.trd={};toast('Traspaso hecho');render(true)}catch(e){err(e)}})}
function closeBr(i){
 if(BI().length<=1)return toast('Debe quedar al menos una sucursal');if(S.pre.some(p=>p.branch==i))return toast('Tiene apartados pendientes: entrégalos o cancélalos primero');
 if(S.users.some(u=>u.role=='vend'&&u.branch==i&&u.active!==false))return toast('Primero cambia de sucursal a sus vendedores (en Usuarios)');
 if(F.some((_,f)=>left(i,f)>0)||chLeft(i)>0)return toast('Aún tiene tamales o champurrado hoy: pásalos a otra sucursal en Traspasos');
 ask('¿Eliminar "'+brs()[i]+'"? Ya no aparecerá, pero sus ventas anteriores se conservan.',async()=>{try{await db.doc('config/main').set({closed:[...(S.cfg.closed||[]),i]},{merge:true});toast('Sucursal eliminada')}catch(e){err(e)}})}
async function openBr(i){try{await db.doc('config/main').set({closed:(S.cfg.closed||[]).filter(x=>x!==i)},{merge:true});toast('Sucursal reabierta')}catch(e){err(e)}}
async function addBranch(){const b=[...brs(),'Sucursal '+(brs().length+1)];try{await db.doc('config/main').set({branches:b},{merge:true});toast('Sucursal agregada. Ponle nombre y guarda.')}catch(e){err(e)}}
function trList(b){const l=S.tr.filter(t=>b==null||t.from==b||t.to==b).sort((a,c)=>c.ts-a.ts);if(!l.length)return '';
 return `<div class="card"><h3>Traspasos de hoy</h3>${l.map(t=>{const d=new Date(t.ts),it=Object.entries(t.q||{}).map(([k,v])=>k=='ch'?v+' L champurrado':v+'× '+F[+k.slice(1)]).join(', ');return `<div class="row"><div><b>${esc(brs()[t.from])} → ${esc(brs()[t.to])}</b><br><small>${pad(d.getHours())}:${pad(d.getMinutes())} · ${esc(it)}</small></div>${b==null||t.from==b?`<button class="gh" onclick="delTr('${t._id}')">Anular</button>`:''}</div>`}).join('')}</div>`}
function delTr(id){const t=S.tr.find(x=>x._id==id);if(!t)return;
 if(Object.entries(t.q||{}).find(([k,v])=>k=='ch'?chLeft(t.to)<v:left(t.to,+k.slice(1))<v))return toast('No se puede anular: la sucursal destino ya vendió parte de esos tamales');
 ask('¿Anular este traspaso?',async()=>{try{const bt=db.batch();bt.set('logs/del_tr_'+id,logD({branch:t.from,branch2:t.to,kind:'anulacion',label:'Traspaso anulado',txt:brs()[t.from]+' → '+brs()[t.to]+' · '+Object.entries(t.q||{}).map(([k,v])=>k=='ch'?v+' L champurrado':v+'× '+F[+k.slice(1)]).join(', ')}));bt.delete('transfers/'+id);await bt.commit();toast('Traspaso anulado')}catch(e){err(e)}})}
function trView(){const f=BI().includes(S.tf)?S.tf:BI()[0];return trForm(f,true)+trList(null)}
function devList(){const l=S.sales.filter(s=>s.type=='devolucion').sort((a,c)=>c.ts-a.ts);if(!l.length)return '';
 return `<div class="card"><h3>Devoluciones de hoy</h3>${l.map(s=>{const d=new Date(s.ts);return `<div class="row"><div>${nz(s.qty)}× ${nm(s.f)} · ${esc(brs()[s.branch])}<br><small>${pad(d.getHours())}:${pad(d.getMinutes())} · ${esc(s.reason)} · ${s.restock?'regresó al inventario':'no regresó al inventario'} · ${esc(s.by)}</small></div></div>`}).join('')}</div>`}

async function saveInv(){const b=curIb(),q={},pa={};
 if(pendAc(b).length){toast('Primero acepta los apartados de hoy de '+brs()[b]);return admAp(b)}
 F.forEach((_,f)=>{const a=paNow(b,f),base=Math.max(0,parseInt($('#q'+f).value)||0);q['f'+f]=base+a;if(a)pa['f'+f]=a});
 q.ch=Math.max(0,parseFloat($('#qch').value)||0);q.pa=pa;
 try{await db.doc(`loads/${D}_${b}`).set({day:D,branch:b,q});if(S.dr)delete S.dr[b];const n=Object.values(pa).reduce((x,v)=>x+v,0);toast('Carga guardada para '+brs()[b]+(n?' · incluye '+n+(n==1?' apartado':' apartados'):''))}catch(e){err(e)}}

 for(;;){t=JSON.stringify(o);if(t.length<=1500000||ks.length<=7)break;delete o[ks.shift()]}
